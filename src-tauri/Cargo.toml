[package]
name = "tafel"
version = "0.3.0"
description = "Desk camera as visual input for agents"
authors = ["Steven Otto"]
edition = "2021"
license = "MIT"

[lib]
name = "tafel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }

[dependencies]
# 2.12 adds the webview permission handler that grants camera access on
# Linux and Windows.
tauri = { version = "2.12", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
rmcp = { version = "=3.1.3", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1.0"
# The only outbound path in the app: fetching frames from a network camera,
# and only ever to a host on the local network (enforced in netcam.rs).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hand landmarks: Apple Vision on macOS, MediaPipe's models through rten
# (pure Rust, no network code) elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.8"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rten = "0.27"
rten-tensor = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"

# Hand detection runs on every camera frame. Dev builds optimize the crates
# that do the work and drop their debug assertions, which alone make
# inference about 1.5 times slower.
[profile.dev.package.rten]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-base]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-gemm]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-parallel]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-simd]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-tensor]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-vecmath]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.image]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.zune-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.zune-jpeg]
opt-level = 3
debug-assertions = false
overflow-checks = false
